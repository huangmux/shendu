version: '3.8'

services:
  shendu:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/prod.db
      - UPLOAD_DIR=/app/uploads
      - MAX_UPLOAD_MB=10
    volumes:
      # Persist SQLite database
      - shendu_data:/app/data
      # Persist uploaded files
      - shendu_uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    init: true
    command: >
      sh -c "
        echo 'Starting Deep Read application...' &&
        npx prisma migrate deploy &&
        echo 'Database migration completed' &&
        node server.js
      "

volumes:
  shendu_data:
    driver: local
  shendu_uploads:
    driver: local